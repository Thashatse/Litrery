name: LitreryiOS
options:
  bundleIdPrefix: com.tefohashatse
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: LitreryiOS/Config/Secrets.xcconfig
  Release: LitreryiOS/Config/Secrets.xcconfig
targets:
  LitreryiOS:
    type: application
    platform: iOS
    sources:
      - path: LitreryiOS
        excludes:
          - "Config/*"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tefohashatse.litrery
        DEVELOPMENT_TEAM: LVYVPFFJYC
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: LitreryiOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  LitreryiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LitreryiOSTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: LVYVPFFJYC
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: LitreryiOS
schemes:
  LitreryiOS:
    build:
      targets:
        LitreryiOS: all
        LitreryiOSTests: [test]
    test:
      targets:
        - LitreryiOSTests
